<!DOCTYPE html>
<html lang="en">

<head>
    <title>Calendar</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <style>
        /* Highlight today's calendar card */
        .today-card {
            border: 2px solid #0d6efd !important;
        }

        /* Highlight today's header */
        .today-header {
            background-color: #0d6efd !important;
        }

        /* Task indicator */
        .task-indicator {
            font-size: 0.7rem;
            width: fit-content;
        }

        /* Make task cards feel clickable */
        .task-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* Calendar navigation buttons */
        .calendar-navigation .btn {
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        /* Add hover effect */
        .calendar-navigation .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Make the Today button stand out */
        .calendar-navigation .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        /* Dark navy Previous and Next buttons */
        .calendar-navigation .btn-dark {
            background-color: #212b45;
            border-color: #212b45;
        }
    </style>
</head>

<body class="bg-body-tertiary">

    <!-- Navigation Bar starts here-->
    <site-navbar></site-navbar>
    <!--Navigation Bar ends here-->

    <!-- Weekly Calendar -->
    <div class="container-fluid bg-body text-dark p-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <!-- Calendar heading and date -->
            <div>
                <a class="btn btn-info mb-3 border-primary border-2 fw-semibold text-white" href="addTask.html">➕ Add a
                    task</a>
                <h2 class="fw-bold mb-0">Weekly Schedule</h2>

                <p id="current-week" class="text-muted mb-0"></p>
            </div>

            <!-- Week navigation buttons -->
            <div class="btn-group calendar-navigation shadow-sm" role="group">

                <button type="button" id="previous-week" class="btn btn-dark fw-bold px-3">
                    <span class="me-1">←</span> Previous
                </button>

                <button type="button" id="this-week" class="btn btn-primary fw-bold px-3">
                    This Week
                </button>

                <button type="button" id="next-week" class="btn btn-dark fw-bold px-3">
                    Next <span class="ms-1">→</span>
                </button>

            </div>


        </div>

        <!-- Seven calendar days -->
        <div id="calendar-go-here" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 mt-3">
        </div>

    </div>


    <!-- Calendar Day Template -->
    <template id="calendarCardTemplate">

        <div class="col">

            <div class="card day-card shadow-sm border-0">

                <div class="card-header bg-dark text-white p-3">

                    <h5 class="calendar-title mb-1"></h5>

                    <p class="calendar-day mb-1"></p>

                    <span class="task-indicator badge bg-info text-dark d-none">
                        0 tasks
                    </span>

                </div>

                <div class="card-body event-list">

                    <div class="day-tasks">
                        <!-- Tasks will appear here -->
                    </div>

                </div>

            </div>

        </div>

    </template>

    <!-- Task Details Modal -->
    <div class="modal fade" id="taskDetailsModal" tabindex="-1" aria-labelledby="taskDetailsTitle" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header bg-dark text-white">

                    <h5 class="modal-title" id="taskDetailsTitle">
                        Task Details
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <h4 id="modal-task-name" class="fw-bold mb-3"></h4>

                    <p class="mb-2">
                        <strong>Date:</strong>
                        <span id="modal-task-date"></span>
                    </p>

                    <p class="mb-2">
                        <strong>Time:</strong>
                        <span id="modal-task-time"></span>
                    </p>

                    <hr>

                    <h6 class="fw-bold">Description</h6>

                    <p id="modal-task-details" class="text-muted mb-0">
                    </p>

                </div>

                <div class="modal-footer">

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/calendar.js"></script>
    <script type="module" src="/src/components/site-navbar.js"></script>


</body>

</html>
