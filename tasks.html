<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Tasks</title>
</head>

<body>
    <!-- Navigation Bar starts here-->
    <site-navbar></site-navbar>
    <!--Navigation Bar ends here-->

    <div class="container-fluid bg-body text-dark p-5">
        <a class="btn btn-info mb-3 border-primary border-2 fw-semibold text-white" href="addTask.html">➕ Add a task</a>
        <h1>Your Tasks</h1>
        <!-- The container where cards are injected -->
        <div id="tasks-go-here" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </div>
    </div>
    <template id="taskCardTemplate">
        <div class="col">
            <div class="card h-100 shadow-sm border-top border-primary border-3">
                <div class="card-body d-flex flex-column">

                    <!-- Header Row: Checkbox + Title on left, Status Badge on right -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="d-flex align-items-center">
                            <!-- Added border border-dark for better visibility -->
                            <input class="form-check-input me-2 task-checkbox border border-dark" type="checkbox"
                                title="Mark as completed">
                            <h5 class="card-title fw-semibold text-dark mb-0">Card title</h5>
                        </div>

                        <!-- Clean red badge with readable white text -->
                        <span class="badge bg-danger text-white task-status">Incomplete</span>
                    </div>

                    <p class="card-text text-muted">Some quick example text...</p>

                    <div class="mt-auto d-flex justify-content-between align-items-center pt-2">
                        <small class="text-muted">
                            <span class="card-day">00/00/00</span> • <span class="card-time">00:00</span>
                        </small>
                        <a href="#a" class="btn btn-primary btn-sm px-3">Edit</a>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <script type="module" src="/src/tasks.js"></script>
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
