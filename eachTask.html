<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
</head>

<body>
    <!-- Navigation Bar starts here-->
    <site-navbar></site-navbar>
    <!--Navigation Bar ends here-->

    <main class="container py-4">
        <h1>Task Details & Editing</h1>

        <form id="editTaskForm" class="mt-4">
            <div class="mb-3">
                <label for="taskNameInput" class="form-label">Task Name</label>
                <input type="text" class="form-control" id="taskNameInput" required>
            </div>

            <div class="mb-3">
                <label for="detailsInput" class="form-label">Details</label>
                <textarea class="form-control" id="detailsInput" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="dateInput" class="form-label">Task Day</label>
                <!-- Change type="text" to type="date" -->
                <input type="date" class="form-control" id="dateInput" required>
            </div>

            <div class="mb-3">
                <label for="timeInput" class="form-label">Task Time</label>
                <input type="time" class="form-control" id="timeInput">
            </div>

            <!-- Action Buttons -->
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" id="deleteBtn" class="btn btn-danger">Delete Task</button>
            <a href="tasks.html" class="btn btn-secondary">Back to Tasks</a>
        </form>
    </main>

    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/eachTask.js"></script>
    <script type="module" src="/src/components/site-navbar.js"></script>
</body>

</html>
