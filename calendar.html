<!DOCTYPE html>
<html lang="en">

<head>
    <title>Calendar</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <style>
        /* Custom style for uniform height and smooth scroll on busy days */
        .day-card {
            min-height: 250px;
            height: 100%;
        }

        .event-list {
            max-height: 180px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="bg-body-tertiary">

    <!-- Navigation Bar starts here-->
    <site-navbar></site-navbar>
    <!--Navigation Bar ends here-->

    <!-- Weekly Calendar -->
    <div class="container-fluid bg-body text-dark p-4">

        <div>
            <h2 class="fw-bold mb-0">Weekly Schedule</h2>

            <p id="current-week" class="text-muted mb-0"></p>
        </div>

        <!-- Seven calendar days -->
        <div id="calendar-go-here" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 mt-3">
        </div>

    </div>

    <!-- Calendar Day Template -->
    <template id="calendarCardTemplate">

        <div class="col">

            <div class="card day-card shadow-sm border-0">

                <div class="card-header bg-dark text-white p-3">

                    <h5 class="calendar-title mb-1"></h5>

                    <p class="calendar-day mb-0"></p>

                </div>

                <div class="card-body event-list">

                    <div class="day-tasks">
                        <!-- Tasks will appear here -->
                    </div>

                </div>

            </div>

        </div>

    </template>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/calendar.js"></script>
    <script type="module" src="/src/components/site-navbar.js"></script>


</body>

</html>
