<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign Up | Time Management</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Yvpbp13VAMtS6ogLs7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous">


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script type="module" src="./src/main.js"></script>

</head>

<body class="bg-body-tertiary">

    <!-- Navigation Bar starts here-->
    <site-navbar></site-navbar>
    <!--Navigation Bar ends here-->

    <!-- Sign Up Form starts here-->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-2">
                            Create an Account
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Start organizing your life today.
                        </p>

                        <form id="signupForm" action="#" method="post">

                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>
                                <input type="text" class="form-control" id="fullName" name="fullName"
                                    placeholder="Enter your full name" autocomplete="name" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="name@example.com" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                                <div class="form-text">
                                    Use at least 8 characters.
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                    placeholder="Re-enter your password" autocomplete="new-password" minlength="8"
                                    required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Sign Up
                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account?
                            <a href="login.html">Log in</a>
                        </p>

                        <div class="text-center mt-3">
                            <a href="index.html" class="text-decoration-none">
                                Back to Home
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
<!--Sign Up Form ends here-->
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script type="module" src="/src/components/site-navbar.js"></script>

</body>

</html>
