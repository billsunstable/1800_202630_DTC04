<!DOCTYPE html>
<html lang="en">

<head>
    <title>Calendar</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="./src/main.js"></script>

    <style>
        /* Custom style for uniform height and smooth scroll on busy days */
        .day-card {
            min-height: 250px;
            height: 100%;
        }

        .event-list {
            max-height: 180px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="bg-body-tertiary">

    <!-- Navigation Bar starts here-->
    <site-navbar></site-navbar>
    <!--Navigation Bar ends here-->

    <!-- Calendar starts here-->

    <div class="container-fluid px-4">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Weekly Schedule</h2>
                <p class="text-muted mb-0">November # – November #, 2026</p>
            </div>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-secondary btn-sm">Previous</button>
                <button type="button" class="btn btn-outline-primary btn-sm active">Today</button>
                <button type="button" class="btn btn-outline-secondary btn-sm">Next</button>
            </div>
        </div>

        <!-- 7-Day Grid Layout -->

        <div class="container-fluid bg-body text-dark p-5">
            <h1>Calendar</h1>
            <div id="calendar-go-here" class="row">
            </div>
        </div>

        <template id="calendarCardTemplate">
            <div class="col">
                <div class="card day-card shadow-sm border-0">
                    <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="calendar-title"></h5>
                            <p class="calendar-day"></p>
                        </div>
                        <a class="badge bg-white text-success rounded-pill read-more" href="#">Edit</a>
                    </div>
                    <div class="card-body p-2 event-list">
                        <p class="text-muted text-center my-4 small">No events</p>
                    </div>
                </div>
            </div>
    </div>
    </div>
    </template>

    </div>
    <!-- Calendar ends here-->

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/calendar.js"></script>
    <script type="module" src="/src/components/site-navbar.js"></script>


</body>

</html>
