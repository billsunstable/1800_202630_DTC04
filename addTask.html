<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
</head>

<body>
    <main class="container py-4" style="max-width: 560px;">
        <h1>Add a new task</h1>

        <form id="addTaskForm" novalidate>
            <div class="mb-3">
                <label for="taskNameInput" class="form-label">Task name</label>
                <input type="text" id="taskNameInput" class="form-control" placeholder="e.g. Task #00" required />
            </div>

            <!-- 🔑 Added Date Input Field -->
            <div class="mb-3">
                <label for="dateInput" class="form-label">Date</label>
                <input type="date" id="dateInput" class="form-control" required />
            </div>

            <div class="mb-3">
                <label for="timeInput" class="form-label">Time</label>
                <input type="time" id="timeInput" class="form-control" placeholder="e.g. 12:42 AM" required />
            </div>

            <div class="mb-3">
                <label for="detailsInput" class="form-label">Details</label>
                <textarea id="detailsInput" class="form-control" rows="3"
                    placeholder="What are some details?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Save task</button>
        </form>
    </main>
</body>
<script type="module" src="/src/addTask.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
